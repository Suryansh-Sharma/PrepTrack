<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">PrepTrack Notification</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 600px;
              width: 100%;
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  padding: 32px;
                  text-align: center;
                  background-color: #111827;
                "
              >
                <h1 style="margin: 0; color: #ffffff; font-size: 28px">
                  PrepTrack
                </h1>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding: 40px 32px">
                <h2
                  th:text="${title}"
                  style="margin-top: 0; color: #111827; font-size: 22px"
                >
                  Your password was changed
                </h2>

                <p style="color: #4b5563; font-size: 16px; line-height: 1.6">
                  Hi
                  <span th:text="${displayName}">Suryansh</span>,
                </p>

                <p
                  th:text="${message}"
                  style="color: #4b5563; font-size: 16px; line-height: 1.6"
                >
                  Your PrepTrack password was changed successfully.
                </p>

                <!-- Optional Action Button -->
                <table
                  th:if="${actionUrl != null and actionText != null}"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td align="center" style="padding: 24px 0">
                      <a
                        th:href="${actionUrl}"
                        th:text="${actionText}"
                        href="#"
                        style="
                          display: inline-block;
                          padding: 14px 28px;
                          background-color: #111827;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 8px;
                          font-size: 16px;
                          font-weight: bold;
                        "
                      >
                        Open PrepTrack
                      </a>
                    </td>
                  </tr>
                </table>

                <!-- Optional Additional Message -->
                <p
                  th:if="${footerMessage != null}"
                  th:text="${footerMessage}"
                  style="color: #6b7280; font-size: 14px; line-height: 1.6"
                >
                  If you did not perform this action, please contact support.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 24px 32px;
                  background-color: #f9fafb;
                  text-align: center;
                "
              >
                <p style="margin: 0; color: #9ca3af; font-size: 12px">
                  © 2026 PrepTrack. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
